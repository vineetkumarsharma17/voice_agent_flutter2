name: voice_agent_flutter
description: Offline multilingual voice agent (EN/ES/FR) with barge-in
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sherpa_onnx: ^1.12.26
  record: ^5.2.1
  just_audio: ^0.9.36
  audio_session: ^0.1.21
  tflite_flutter: ^0.12.1
  path_provider: ^2.1.2
  path: ^1.9.0

dependency_overrides:
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/README.md
    - assets/models/asr/en/
    - assets/models/asr/es/
    - assets/models/asr/fr/
    - assets/models/intent/en/
    - assets/models/intent/es/
    - assets/models/intent/fr/
    - assets/models/slots/en/
    - assets/models/slots/es/
    - assets/models/slots/fr/
    - assets/models/response/
    - assets/models/vad/
    - assets/models/kws/
